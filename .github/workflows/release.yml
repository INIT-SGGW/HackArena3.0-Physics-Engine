name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: windows-x64
            os: windows-latest
            triplet: x64-windows-static-md
            artifact_name: boink-windows-x64

          - name: linux-x64
            os: ubuntu-latest
            triplet: x64-linux
            artifact_name: boink-linux-x64

          - name: linux-arm64
            os: ubuntu-24.04-arm
            triplet: arm64-linux
            artifact_name: boink-linux-arm64

          - name: macos-arm64
            os: macos-latest
            triplet: arm64-osx
            artifact_name: boink-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Linux: install build tools + GLFW system dependencies ─────────────
      # GLFW needs X11/Wayland headers even on headless CI (compile-time only).
      # cmake + ninja are also missing on the bare ARM runner image.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      # ── macOS: make sure ninja is available ───────────────────────────────
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # ── vcpkg ─────────────────────────────────────────────────────────────
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      # ── Windows: MSVC dev shell ────────────────────────────────────────────
      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure CMake
        run: >
          cmake --preset release
          -DVCPKG_TARGET_TRIPLET=${{ matrix.config.triplet }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build ${{ github.workspace }}/build/release --config Release --parallel

      # ── Install ───────────────────────────────────────────────────────────
      - name: Install
        run: cmake --install ${{ github.workspace }}/build/release --config Release

      # ── Windows: copy GLFW files from vcpkg installed tree ────────────────
      - name: Copy GLFW files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tripletDir = "$env:VCPKG_ROOT/installed/${{ matrix.config.triplet }}"
          $destLib    = "${{ github.workspace }}/install/lib"
          $destBin    = "${{ github.workspace }}/install/bin"

          New-Item -ItemType Directory -Force -Path $destLib | Out-Null
          New-Item -ItemType Directory -Force -Path $destBin | Out-Null

          Get-ChildItem -Path $tripletDir -Recurse -Include "glfw3.lib" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Copying lib: $($_.FullName)"
            Copy-Item $_.FullName -Destination $destLib -Force
          }
          Get-ChildItem -Path $tripletDir -Recurse -Include "glfw3.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Copying dll: $($_.FullName)"
            Copy-Item $_.FullName -Destination $destBin -Force
          }

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd "${{ github.workspace }}/install"
          tar -czf "${{ github.workspace }}/${{ matrix.config.artifact_name }}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}/install/*" `
            -DestinationPath "${{ github.workspace }}/${{ matrix.config.artifact_name }}.zip"

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact_name }}
          path: |
            ${{ github.workspace }}/${{ matrix.config.artifact_name }}.tar.gz
            ${{ github.workspace }}/${{ matrix.config.artifact_name }}.zip
          if-no-files-found: error

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/boink-windows-x64.zip
            artifacts/boink-linux-x64.tar.gz
            artifacts/boink-linux-arm64.tar.gz
            artifacts/boink-macos-arm64.tar.gz
