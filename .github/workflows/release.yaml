name: Build and Upload Release Asset

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AMD64)
    runs-on: ubuntu-latest

    env:
      # NAPRAWA 1: Podajemy pełną, absolutną ścieżkę do folderu cache.
      # /home/runner/ to domyślny katalog użytkownika na GitHub Actions.
      VCPKG_BINARY_SOURCES: "clear;files,/home/runner/.cache/vcpkg/archives,readwrite"

    steps:
      # 1. Pobranie kodu źródłowego
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Zainstalowanie CMake i Ninja (szybki build system)
      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      # 2.5 Weź co się da z binary cache'a
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: cache-vcpkg-restore
        with:
          path: /home/runner/.cache/vcpkg/archives
          # "primary key" nie jest tu aż tak ważny, ważniejsze są restore-keys
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-reset
          # restore-keys: Bierzemy cokolwiek, co zaczyna się od Linux-vcpkg-
          # Dzięki temu pobierzemy cache z poprzedniego (nawet nieudanego) runa
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # 3. Konfiguracja vcpkg (cache, bootstrap)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Ścieżka do vcpkg.json (domyślna, ale warto być jawnym)
          vcpkgJsonGlob: 'vcpkg.json'

      # 4. Konfiguracja projektu (CMake Configure)
      # To tutaj dzieje się magia instalacji zależności z vcpkg.json
      - name: Configure CMake
        run: |
          cmake --preset=release

      # --- KROK 3: SAVE (Zapisywanie - nawet przy błędzie!) ---
      # To uruchomi się ZAWSZE, nawet jak 'Build' zwróci błąd.
      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        if: always() 
        with:
          path: /home/runner/.cache/vcpkg/archives
          # Dodajemy github.run_id do klucza.
          # DLACZEGO? Bo cache w GitHub jest "tylko do odczytu" po zapisaniu.
          # Nie da się zaktualizować istniejącego klucza. Musimy stworzyć nowy, unikalny klucz
          # za każdym razem, gdy doszły nowe binarki.
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # 5. Budowanie projektu (Kompilacja Twojego kodu)
      - name: Build
        run: cmake --build build/release

      # 6. Pakowanie (Stworzenie paczki wynikowej)
      # Używamy cmake --install, aby zebrać pliki w ładny folder 'install',
      # a następnie pakujemy go do .tar.gz
      - name: Package
        run: |
          mkdir release_package
          
          # Instalujemy z folderu build/release do folderu release_package
          cmake --install build/release --prefix release_package
          
          # Tworzenie archiwum
          tar -czvf boink-native-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz -C release_package .

      # 7. Wrzucenie pliku do Release'a
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: boink-native-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz

      # --- Opcjonalnie: Debugowanie ---
      # Jeśli build nadal failuje, ten krok wrzuci logi vcpkg jako artefakt,
      # żebyś mógł je pobrać i przeczytać, zamiast patrzeć w konsolę.
      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: build/vcpkg_installed/vcpkg/buildtrees/**/*.log