name: Build and Upload Release Asset

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      description:
        description: 'Uruchom to, aby zaktualizować/rozgrzać cache. Nie utworzy to Release.'
        required: false
        default: 'Manual Cache Update'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Konfiguracja dla Linuxa
          - name: Linux (AMD64)
            target: linux
            triplet: x64-linux
            # Nadpisujemy zmienne CMake w locie
            cmake_args: "-DCMAKE_SYSTEM_NAME=Linux" 
            artifact_name: boink-native
            asset_extension: tar.gz
            
          # Konfiguracja dla Windowsa (Cross-compile via MinGW)
          - name: Windows (AMD64 - MinGW)
            target: windows
            triplet: x64-mingw-dynamic # Community triplet wbudowany w vcpkg
            # Dla MinGW musimy powiedzieć CMake, że to Windows
            cmake_args: "-DCMAKE_SYSTEM_NAME=Windows"
            artifact_name: boink-native
            asset_extension: zip

    env:
      # Ważne: Cache jest dzielony między jobami, ale klucze będą inne dzięki ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: "clear;files,/home/runner/.cache/vcpkg/archives,readwrite"
      # Ustawiamy triplet globalnie dla vcpkg w tym jobie
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- KROK SPECIFICZNY DLA WINDOWS (MINGW) ---
      # Instalujemy kompilator MinGW-w64 na maszynie Linux
      - name: Install MinGW-w64
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      # Cache przywracamy z uwzględnieniem TRIPLETU w kluczu!
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: cache-vcpkg-restore
        with:
          path: /home/runner/.cache/vcpkg/archives
          # Klucz musi zawierać triplet, inaczej Linux spróbuje użyć bibliotek Windowsa
          key: ${{ matrix.target }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ matrix.target }}-vcpkg-${{ matrix.triplet }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          # Przekazujemy triplet z matrixa
          vcpkgTriplet: ${{ matrix.triplet }}

      - name: Configure CMake
        # Dodajemy flagi z matrixa oraz wymuszamy triplet w CMake
        run: |
          cmake --preset=release \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            ${{ matrix.cmake_args }}

      # Zapisywanie cache (zawsze)
      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /home/runner/.cache/vcpkg/archives
          key: ${{ matrix.target }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build build/release

      # --- PAKOWANIE (Różne dla systemów) ---
      
      # 1. Przygotowanie folderu install (wspólne)
      - name: Install to staging
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir release_package
          cmake --install build/release --prefix release_package

      # 2. Pakowanie Linux (tar.gz)
      - name: Package Linux
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }}-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz -C release_package .

      # 3. Pakowanie Windows (zip)
      - name: Package Windows
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'windows'
        run: |
          # Instalujemy zip jeśli go nie ma (zwykle jest na ubuntu-latest)
          cd release_package
          zip -r ../${{ matrix.artifact_name }}-${{ github.event.release.tag_name }}-windows-x86_64.zip .

      # --- UPLOAD ---
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz
            ${{ matrix.artifact_name }}-${{ github.event.release.tag_name }}-windows-x86_64.zip