name: Build and Upload Release Asset

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AMD64)
    runs-on: ubuntu-latest

    env:
      # NAPRAWA 1: Podajemy pełną, absolutną ścieżkę do folderu cache.
      # /home/runner/ to domyślny katalog użytkownika na GitHub Actions.
      VCPKG_BINARY_SOURCES: "clear;files,/home/runner/.cache/vcpkg/archives,readwrite"

    steps:
      # 1. Pobranie kodu źródłowego
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.5. Instalacja zależności systemowych dla GLFW/Grafiki ---
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config libxi-dev libxrandr-dev

      # 2. Zainstalowanie CMake i Ninja (szybki build system)
      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      # 2.5 Weź co się da z binary cache'a
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          # Co cache'ujemy? Folder z gotowymi paczkami
          path: ~/.cache/vcpkg/archives
          # Klucz cache'a: System + Hash pliku vcpkg.json.
          # Jeśli zmienisz coś w vcpkg.json, hash się zmieni i cache zostanie odświeżony.
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          # Restore keys: Jeśli dokładny klucz nie pasuje, spróbuj pobrać najnowszy dostępny dla tego systemu.
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # 3. Konfiguracja vcpkg (cache, bootstrap)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Ścieżka do vcpkg.json (domyślna, ale warto być jawnym)
          vcpkgJsonGlob: 'vcpkg.json'

      # 4. Konfiguracja projektu (CMake Configure)
      # To tutaj dzieje się magia instalacji zależności z vcpkg.json
      - name: Configure CMake
        run: |
          cmake --preset=release

      # 5. Budowanie projektu (Kompilacja Twojego kodu)
      - name: Build
        run: cmake --build build --config Release

      # 6. Pakowanie (Stworzenie paczki wynikowej)
      # Używamy cmake --install, aby zebrać pliki w ładny folder 'install',
      # a następnie pakujemy go do .tar.gz
      - name: Package
        run: |
          mkdir release_package
          
          # Instalujemy z folderu build/release do folderu release_package
          cmake --install build/release --prefix release_package
          
          # Tworzenie archiwum
          tar -czvf boink-native-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz -C release_package .

      # 7. Wrzucenie pliku do Release'a
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: boink-native-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz

      # --- Opcjonalnie: Debugowanie ---
      # Jeśli build nadal failuje, ten krok wrzuci logi vcpkg jako artefakt,
      # żebyś mógł je pobrać i przeczytać, zamiast patrzeć w konsolę.
      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: build/vcpkg_installed/vcpkg/buildtrees/**/*.log